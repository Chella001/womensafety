spring:
  application:
    name: women-safety-backend

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

app:
  firebase:
    # Firebase project that issues the ID tokens we accept (required for token verification).
    project-id: ${FIREBASE_PROJECT_ID:}
    # Path to a service-account JSON key. Leave empty to use Application Default Credentials
    # (e.g. the GOOGLE_APPLICATION_CREDENTIALS environment variable). Never commit this file.
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
    # Also reject ID tokens of revoked / disabled users (costs one extra Firebase call per request).
    check-revoked: ${FIREBASE_CHECK_REVOKED:true}
    # Firestore database id. Leave as "(default)" unless the database was created with another id.
    firestore-database-id: ${FIREBASE_FIRESTORE_DATABASE_ID:(default)}
  admin:
    # Comma-separated Firebase UIDs of the administrators (environment variable ADMIN_UIDS).
    # Empty by default: nobody is an administrator until the owner configures their own UID here.
    uids: ${ADMIN_UIDS:}
  policy:
    consent-version: ${CONSENT_VERSION:2026-10-v1}
    alert-retention-days: ${ALERT_RETENTION_DAYS:90}
    max-alerts-per-window: ${MAX_ALERTS_PER_WINDOW:5}
    alert-window-minutes: 10
    max-emergency-contacts: ${MAX_EMERGENCY_CONTACTS:5}
    # Hourly job: deletes RESOLVED/CANCELLED alerts (with deliveries and history) once retainUntil has passed.
    # Open alerts are never purged until an administrator closes them.
    retention-purge-enabled: ${RETENTION_PURGE_ENABLED:true}
  notifications:
    # TEST (default): the mock SMS provider simulates messages, NOTHING is sent. REAL: send through Twilio (needs the
    # TWILIO_* variables below; the application refuses to start in REAL mode without them).
    mode: ${NOTIFICATIONS_MODE:TEST}
    worker-enabled: ${NOTIFICATIONS_WORKER_ENABLED:true}
    worker-interval-ms: 3000
    lease-seconds: 60
    max-attempts: ${NOTIFICATIONS_MAX_ATTEMPTS:3}
    retry-base-seconds: 20
    # Public https base URL of this API (for example https://api.example.com); enables provider delivery receipts.
    public-base-url: ${PUBLIC_BASE_URL:}
    admin-push-enabled: ${ADMIN_PUSH_ENABLED:true}
    # Administrator uids that receive pushes (comma separated). Empty = every registered administrator device.
    admin-push-recipients: ${ADMIN_PUSH_RECIPIENTS:}
    attention-minutes: ${ALERT_ATTENTION_MINUTES:5}
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from: ${TWILIO_FROM:}
      messaging-service-sid: ${TWILIO_MESSAGING_SERVICE_SID:}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    auth-per-minute: 20
    general-per-minute: 240
  cors:
    # Origins allowed to call the API from a browser (comma-separated).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
